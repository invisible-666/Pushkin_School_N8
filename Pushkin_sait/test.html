<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Школа №8 — Тест</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="test.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" />
</head>
<body>
 
  <nav class="navigation">
    <a class="nav-logo" href="index.html">
      <div class="nav-logo-icon"><img src="images/pushkin_icon.png" alt="Пушкин"></div>
      <span>Школа N8 имени А.С. Пушкина</span>
    </a>
    <ul>
      <li class="list">
        <a href="index.html">
          <span class="icon"><i class="fa-solid fa-house"></i></span>
          <span class="text">Главная</span>
        </a>
      </li>
      <li class="list">
        <a href="school.html">
          <span class="icon"><i class="fa-solid fa-school"></i></span>
          <span class="text">Школа</span>
        </a>
      </li>
      <li class="list">
        <a href="pushkin.html">
          <span class="icon"><i class="fa-solid fa-feather-pointed"></i></span>
          <span class="text">Пушкин</span>
        </a>
      </li>
      <li class="list">
        <a href="clubs.html">
          <span class="icon"><i class="fa-solid fa-people-group"></i></span>
          <span class="text">Кружки</span>
        </a>
      </li>
      <li class="list">
        <a href="news.html">
          <span class="icon"><i class="fa-solid fa-newspaper"></i></span>
          <span class="text">Новости</span>
        </a>
      </li>
      <li class="list active">
        <a href="test.html">
          <span class="icon"><i class="fa-solid fa-circle-question"></i></span>
          <span class="text">Тест</span>
        </a>
      </li>
      <li class="list">
        <a href="contact.html">
          <span class="icon"><i class="fa-solid fa-address-book"></i></span>
          <span class="text">Контакты</span>
        </a>
      </li>
      <div class="indicator"></div>
    </ul>
  </nav>
 
  <main>
    <div class="page-banner">
      <h1>Проверь свои знания</h1>
    </div>
 
    <!-- QUIZ CONTAINER -->
    <section class="quiz-section" id="quizSection">
      <!-- Questions rendered by JS -->
    </section>
 
    <!-- RESULTS (hidden until done) -->
    <section class="results-section" id="resultsSection" style="display:none;">
      <div class="results-card">
        <h2>Тест завершён!</h2>
        <div class="score-display">
          <span class="score-num" id="scoreNum">0</span>
          <span class="score-total" id="scoreTotal">/ 0</span>
        </div>
        <p class="score-percent" id="scorePercent"></p>
        <p class="score-grade"  id="scoreGrade"></p>
        <button class="btn-restart" onclick="restartQuiz()">
          <i class="fa-solid fa-rotate-right"></i> Начать заново
        </button>
      </div>
 
      <!-- Solutions -->
      <div class="solutions-wrap" id="solutionsWrap"></div>
    </section>
 
    <!-- SUBMIT button -->
    <div class="quiz-footer" id="quizFooter">
      <button class="btn-submit" onclick="submitQuiz()">
        <i class="fa-solid fa-paper-plane"></i> Отправить ответы
      </button>
    </div>
  </main>
 
  <footer><p>&copy;2026 Все права защищены</p></footer>
 
  <script src="script.js"></script>
  <script src="test.js"></script>
</body>
</html>
