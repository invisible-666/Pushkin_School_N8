<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Школа №8 — Панель управления</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="admin.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" />
</head>
<body>

  <!-- LOGIN SCREEN -->
  <div class="admin-wrap" id="loginScreen">
    <div class="login-box">
      <h1><i class="fa-solid fa-lock"></i> Вход для директора</h1>
      <input type="email" id="loginEmail" placeholder="Email" autocomplete="username" />
      <input type="password" id="loginPassword" placeholder="Пароль" autocomplete="current-password" />
      <button id="loginBtn">Войти</button>
      <p class="login-error" id="loginError"></p>
    </div>
  </div>

  <!-- DASHBOARD (hidden until logged in) -->
  <div class="admin-wrap" id="dashboard" style="display:none;">

    <div class="admin-header">
      <h1><i class="fa-solid fa-gauge"></i> Панель управления сайтом</h1>
      <button class="btn-logout" id="logoutBtn"><i class="fa-solid fa-right-from-bracket"></i> Выйти</button>
    </div>

    <div class="admin-tabs">
      <button class="admin-tab-btn active" data-tab="clubs">Кружки</button>
      <button class="admin-tab-btn" data-tab="news">Новости</button>
      <button class="admin-tab-btn" data-tab="hours">Часы работы</button>
      <button class="admin-tab-btn" data-tab="gallery">Фото галерея</button>
    </div>

    <!-- ==== CLUBS TAB ==== -->
    <div class="admin-panel active" id="panel-clubs">
      <div class="form-card">
        <h2 id="clubFormTitle">Добавить кружок</h2>
        <input type="hidden" id="clubId" />
        <div class="form-row">
          <label>Название кружка</label>
          <input type="text" id="clubName" placeholder="Например: Баскетбол" />
        </div>
        <div class="form-row">
          <label>Тип</label>
          <select id="clubType">
            <option value="sport">Спортивный</option>
            <option value="intellectual">Интеллектуальный</option>
          </select>
        </div>
        <div class="form-row">
          <label>Расписание</label>
          <input type="text" id="clubSchedule" placeholder="Например: Пн, Ср, Пт — 16:00" />
        </div>
        <div class="form-row">
          <label>Преподаватель</label>
          <input type="text" id="clubTeacher" placeholder="Имя преподавателя" />
        </div>
        <div class="form-row">
          <label>Описание</label>
          <textarea id="clubDesc" rows="3" placeholder="Короткое описание кружка"></textarea>
        </div>
        <div class="form-actions">
          <button class="btn-save" id="saveClubBtn">Сохранить</button>
          <button class="btn-cancel" id="cancelClubBtn" style="display:none;">Отмена</button>
        </div>
      </div>
      <div class="admin-list" id="clubsList"></div>
    </div>

    <!-- ==== NEWS TAB ==== -->
    <div class="admin-panel" id="panel-news">
      <div class="form-card">
        <h2 id="newsFormTitle">Добавить новость</h2>
        <input type="hidden" id="newsId" />
        <div class="form-row">
          <label>Заголовок</label>
          <input type="text" id="newsTitle" placeholder="Заголовок новости" />
        </div>
        <div class="form-row">
          <label>Текст</label>
          <textarea id="newsText" rows="4" placeholder="Текст новости"></textarea>
        </div>
        <div class="form-row">
          <label>Ссылка на фото (необязательно)</label>
          <input type="text" id="newsImage" placeholder="https://..." />
        </div>
        <div class="form-actions">
          <button class="btn-save" id="saveNewsBtn">Опубликовать</button>
          <button class="btn-cancel" id="cancelNewsBtn" style="display:none;">Отмена</button>
        </div>
      </div>
      <div class="admin-list" id="newsList"></div>
    </div>

    <!-- ==== HOURS TAB ==== -->
    <div class="admin-panel" id="panel-hours">
      <div class="form-card">
        <h2>Часы работы школы</h2>
        <div class="form-row">
          <label>Текст, который увидят посетители (страница «Контакты»)</label>
          <textarea id="hoursText" rows="2" placeholder="Например: Пн–Пт: 08:00 – 17:00"></textarea>
        </div>
        <div class="form-actions">
          <button class="btn-save" id="saveHoursBtn">Сохранить</button>
        </div>
      </div>
    </div>

    <!-- ==== GALLERY TAB ==== -->
    <div class="admin-panel" id="panel-gallery">
      <div class="form-card">
        <h2>Добавить фото в галерею</h2>
        <p style="color:var(--text-muted); font-size:12.5px; margin-bottom:14px;">
          Совет: загрузите фото на сайт <a href="https://imgbb.com" target="_blank" style="color:var(--gold);">imgbb.com</a> (бесплатно),
          скопируйте прямую ссылку на картинку и вставьте её сюда.
        </p>
        <div class="form-row">
          <label>Ссылка на фото</label>
          <input type="text" id="photoUrl" placeholder="https://..." />
        </div>
        <div class="form-row">
          <label>Подпись (необязательно)</label>
          <input type="text" id="photoCaption" placeholder="Например: Выпускной 2026" />
        </div>
        <div class="form-actions">
          <button class="btn-save" id="savePhotoBtn">Добавить фото</button>
        </div>
      </div>
      <div class="admin-list" id="galleryList"></div>
    </div>

  </div>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script src="admin.js"></script>
</body>
</html>
